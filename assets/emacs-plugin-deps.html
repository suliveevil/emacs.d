: "lsp-bridge", "to": "json", "type": "require"}, {"from": "lsp-bridge", "to": "map", "type": "require"}, {"from": "lsp-bridge", "to": "markdown-mode", "type": "require"}, {"from": "lsp-bridge", "to": "pulse", "type": "require"}, {"from": "lsp-bridge", "to": "seq", "type": "require"}, {"from": "lsp-bridge", "to": "subr-x", "type": "require"}, {"from": "lsp-bridge", "to": "tramp", "type": "require"}, {"from": "mode-minder", "to": "button", "type": "require"}, {"from": "mode-minder", "to": "cl-lib", "type": "require"}, {"from": "mode-minder", "to": "help-fns", "type": "require"}, {"from": "mode-minder", "to": "seq", "type": "require"}, {"from": "modeline-char", "to": "second-sel", "type": "require"}, {"from": "nov-xwidget", "to": "nov", "type": "declared"}, {"from": "nov-xwidget", "to": "browse-url", "type": "require"}, {"from": "nov-xwidget", "to": "cl-lib", "type": "require"}, {"from": "nov-xwidget", "to": "evil-core", "type": "require"}, {"from": "nov-xwidget", "to": "shr", "type": "require"}, {"from": "nov-xwidget", "to": "xwidget", "type": "require"}, {"from": "org-mac-link", "to": "org-goto", "type": "require"}, {"from": "org-roam-similarity", "to": "org", "type": "declared"}, {"from": "org-similarity", "to": "f", "type": "declared"}, {"from": "org-similarity", "to": "f", "type": "require"}, {"from": "pyim-tsinghua-dict", "to": "pyim", "type": "declared"}, {"from": "pyim-tsinghua-dict", "to": "pyim-dict", "type": "require"}, {"from": "screenshot", "to": "posframe", "type": "declared"}, {"from": "screenshot", "to": "transient", "type": "declared"}, {"from": "screenshot", "to": "lisp-mnt", "type": "require"}, {"from": "screenshot", "to": "posframe", "type": "require"}, {"from": "screenshot", "to": "transient", "type": "require"}, {"from": "ts-fold", "to": "fringe-helper", "type": "declared"}, {"from": "ts-fold", "to": "s", "type": "declared"}, {"from": "ts-fold", "to": "tree-sitter", "type": "declared"}, {"from": "ts-fold", "to": "s", "type": "require"}, {"from": "ts-fold", "to": "seq", "type": "require"}, {"from": "ts-fold", "to": "subr-x", "type": "require"}, {"from": "ts-fold", "to": "tree-sitter", "type": "require"}, {"from": "browser-hist", "to": "sqlite", "type": "after"}, {"from": "consult", "to": "org", "type": "after"}, {"from": "consult-dir", "to": "consult", "type": "after"}, {"from": "consult-dir", "to": "vertico", "type": "after"}, {"from": "consult-yasnippet", "to": "consult", "type": "after"}, {"from": "consult-yasnippet", "to": "yasnippet", "type": "after"}, {"from": "vertico-posframe", "to": "vertico", "type": "after"}, {"from": "vertico-posframe", "to": "posframe", "type": "after"}, {"from": "org-roam", "to": "org", "type": "after"}, {"from": "org-roam-ui", "to": "org-roam", "type": "after"}, {"from": "consult-org-roam", "to": "org", "type": "after"}, {"from": "consult-org-roam", "to": "consult", "type": "after"}, {"from": "org-similarity", "to": "org", "type": "after"}, {"from": "elfeed-dashboard", "to": "elfeed", "type": "after"}, {"from": "elfeed-org", "to": "elfeed", "type": "after"}, {"from": "osm", "to": "org", "type": "after"}, {"from": "nov-xwidget", "to": "nov", "type": "after"}]};
const color = {active:["#E1F5EE","#0F6E56"], installed:["#FAEEDA","#854F0B"], builtin:["#F1EFE8","#5F5E5A"]};
const ecolor = {declared:"#185FA5", require:"#7F77DD", after:"#D85A30"};
const nodes = DATA.nodes.map(d => Object.create(d));
const index = new Map(nodes.map(d => [d.name, d]));
const links = DATA.edges.filter(e => index.has(e.from) && index.has(e.to))
                        .map(d => Object.create(d));

const W = document.getElementById("chart").clientWidth, H = 720;
const svg = d3.select("#chart").append("svg").attr("viewBox", [0,0,W,H]);
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", ev => g.attr("transform", ev.transform)));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.name).distance(60).strength(0.35))
  .force("charge", d3.forceManyBody().strength(-160))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collide", d3.forceCollide(d => 6 + Math.min(d.in_degree, 10) * 1.3));

const link = g.append("g").selectAll("line").data(links).join("line")
  .attr("class", d => "link t-" + d.type)
  .attr("stroke", d => ecolor[d.type] || "#888780")
  .attr("stroke-width", 1)
  .attr("stroke-opacity", 0.5)
  .attr("stroke-dasharray", d => d.type === "require" ? "4,3" : d.type === "after" ? "1,3" : null);

const node = g.append("g").selectAll("g").data(nodes).join("g").attr("class", "node");
node.append("circle")
  .attr("r", d => 4 + Math.min(d.in_degree, 12) * 0.9)
  .attr("fill", d => color[d.kind][0])
  .attr("stroke", d => color[d.kind][1]);
node.append("text").attr("class", "label")
  .attr("x", d => 6 + Math.min(d.in_degree, 12) * 0.9).attr("y", 3)
  .text(d => d.in_degree >= 3 || d.kind === "active" ? d.name : "");

const tip = d3.select("#tip");
node.on("mousemove", (ev, d) => {
    const deps = (d.declared || []).join(", ") || "无";
    const by = links.filter(l => l.to.name === d.name).map(l => l.from.name).join(", ") || "无";
    tip.style("display","block").style("left",(ev.pageX+14)+"px").style("top",(ev.pageY+10)+"px")
       .html("<b>" + d.name + "</b> <span style='color:#5F5E5A'>" + (d.version||"") + "</span><br>"
             + "来源: " + d.source + " | 状态: " + (d.active ? "已启用" : "未启用") + "<br>"
             + "依赖: " + deps + "<br>被依赖: " + by);
  }).on("mouseleave", () => tip.style("display","none"));

sim.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => "translate(" + d.x + "," + d.y + ")");
});

document.getElementById("q").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  if (!q) {
    node.attr("opacity", 1); link.attr("stroke-opacity", 0.5); return;
  }
  const hit = index.get(q) || nodes.find(n => n.name.toLowerCase().includes(q));
  if (!hit) { node.attr("opacity", 0.15); link.attr("stroke-opacity", 0.05); return; }
  const near = new Set([hit.name]);
  links.forEach(l => {
    if (l.source.name === hit.name) near.add(l.target.name);
    if (l.target.name === hit.name) near.add(l.source.name);
  });
  node.attr("opacity", d => near.has(d.name) ? 1 : 0.12);
  link.attr("stroke-opacity", d => (d.source.name === hit.name || d.target.name === hit.name) ? 0.95 : 0.04);
});

const hubs = nodes.filter(n => n.kind !== "builtin" && n.in_degree > 0)
                  .sort((a,b) => b.in_degree - a.in_degree).slice(0, 15);
document.getElementById("hub").innerHTML =
  "<tr><th>包</th><th>被依赖次数</th><th>状态</th><th>依赖方</th></tr>" +
  hubs.map(h => {
    const by = links.filter(l => l.to.name === h.name).map(l => l.from.name).slice(0,6).join(", ");
    return "<tr><td>" + h.name + "</td><td>" + h.in_degree + "</td><td>" +
           (h.active ? "已启用" : "未启用") + "</td><td>" + by + "</td></tr>";
  }).join("");
</script>
